name: Publication fence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl --fail --silent --show-error --location -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location -o /tmp/checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          cd /tmp
          grep " gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sed "s/gitleaks_${version}_linux_x64.tar.gz/gitleaks.tar.gz/" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan every reachable commit with generic rules and gitleaks
        run: node tools/fence/cli.ts --mode history --generic
      - run: pnpm check
      - run: pnpm test
