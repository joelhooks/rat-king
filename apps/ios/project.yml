name: RatKing
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Rat King
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_RKMailboxURL: $(RK_MAILBOX_URL)
    INFOPLIST_KEY_RKMailboxAudience: $(RK_MAILBOX_AUDIENCE)
    INFOPLIST_KEY_RKPhoneDID: $(RK_PHONE_DID)
    INFOPLIST_KEY_RKBuildCommit: $(RK_BUILD_COMMIT)
    PRODUCT_BUNDLE_IDENTIFIER: $(RK_BUNDLE_ID)
    DEVELOPMENT_TEAM: $(RK_TEAM_ID)
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  RatKing:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
  RatKingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../packages/envelope/test/vectors
        type: folder
        buildPhase: resources
    dependencies:
      - target: RatKing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RK_BUNDLE_ID).tests
schemes:
  RatKing:
    build:
      targets:
        RatKing: all
    test:
      targets:
        - RatKingTests
