name: RatKing
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Rat King
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    PRODUCT_BUNDLE_IDENTIFIER: $(RK_BUNDLE_ID)
    DEVELOPMENT_TEAM: $(RK_TEAM_ID)
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  RatKing:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/App/Info.plist
  RatKingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../packages/lexicon/test/fixtures
        type: folder
        buildPhase: resources
      - path: ../../packages/envelope/test/vectors
        type: folder
        buildPhase: resources
    dependencies:
      - target: RatKing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RK_BUNDLE_ID).tests
  RatKingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RatKing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RK_BUNDLE_ID).uitests
        TEST_TARGET_NAME: RatKing
schemes:
  RatKing:
    build:
      targets:
        RatKing: all
    test:
      targets:
        - RatKingTests
        - RatKingUITests
