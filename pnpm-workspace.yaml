packages:
  - "apps/*"
  - "packages/*"
  - "tools/grokbox"

overrides:
  "foldkit>effect": "4.1.4"
  "@effect/platform-browser": "4.1.4"
  "@effect/platform-node-shared": "4.1.4"
  "@effect/sql-d1": "4.1.4"
  "@effect/sql-sqlite-do": "4.1.4"
  "@effect/vitest": "4.1.4"
  vite: "8.3.4"
  yaml: "2.9.1"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - alchemy@2.0.0-beta.87
  - "@alchemy.run/cloudflare@2.0.0-beta.87"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.87"
