packages:
  - "apps/*"
  - "packages/*"
  - "tools/grokbox"

overrides:
  "@mischief/worker>effect": "4.0.5"
  "foldkit>effect": "4.0.5"
  "@effect/platform-browser": "4.0.5"
  "@effect/platform-node-shared": "4.0.5"
  "@effect/sql-d1": "4.0.5"
  "@effect/sql-sqlite-do": "4.0.5"
  "@effect/vitest": "4.0.5"
  vite: "8.3.4"
  yaml: "2.9.1"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Exact pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - alchemy@2.0.0-beta.81
  - xstate@6.0.0-alpha.70
  - "@xstate/effect@1.0.0-alpha.9"
  - "@distilled.cloud/aws@1.0.0-rc.13"
  - "@distilled.cloud/axiom@1.0.0-rc.13"
  - "@distilled.cloud/cloudflare@1.0.0-rc.13"
